name: Refresh Dashboard Data

on:
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - "scripts/build_dashboard.py"
      - "dashboard/schema/**"
      - ".github/workflows/refresh-dashboard.yml"
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Commit generated dashboard data
        run: |
          if git diff --quiet -- dashboard/data; then
            echo "No dashboard data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          git commit -m "Refresh dashboard data [skip ci]"
          git push
